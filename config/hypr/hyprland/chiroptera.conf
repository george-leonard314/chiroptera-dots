# Chiroptera-specific binds and rules, sourced from hyprland.conf.
bind = SUPER, Space, togglefloating
bind = SUPER, S, exec, chiroptera msg panel-toggle control-center
bind = SUPER, period, exec, chiroptera msg settings-toggle
bind = SUPER, Tab, exec, chiroptera msg window-switcher
bind = SUPER, L, exec, chiroptera msg session lock
bindl = , XF86AudioRaiseVolume, exec, chiroptera msg volume-up
bindl = , XF86AudioLowerVolume, exec, chiroptera msg volume-down
bindl = , XF86AudioMute, exec, chiroptera msg volume-mute
bindl = , XF86MonBrightnessUp, exec, chiroptera msg brightness-up
bindl = , XF86MonBrightnessDown, exec, chiroptera msg brightness-down
windowrule = float on, match:class dev.chiroptera.Chiroptera
layerrule = no_anim true, match:namespace ^chiroptera-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = blur true, match:namespace ^chiroptera-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = ignore_alpha 0.5, match:namespace ^chiroptera-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
# Screenshots (Print = region, Shift+Print = full monitor, Ctrl+Print = annotate)
unbind = , Print
bindl = , Print, exec, chiroptera msg screenshot-region
bindl = SHIFT, Print, exec, chiroptera msg screenshot-fullscreen
bindl = CTRL, Print, exec, chiroptera msg screenshot-annotate
# Window groups: easier keys. Super+G toggles a group, Super+Shift+G pulls the window out.
# Alt+Tab / Shift+Alt+Tab keep cycling inside the group as before.
bind = SUPER, G, togglegroup
bind = SUPER SHIFT, G, moveoutofgroup
# Terminal and file manager open floating and centered at 60% first;
# Super+Alt+Space (togglefloating) drops them into the tiling layout.
windowrule = float true, match:class ^foot$
windowrule = size 1300 620, match:class ^foot$
windowrule = float true, match:class ^thunar$
windowrule = size 1152 650, match:class ^thunar$
