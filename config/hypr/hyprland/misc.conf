misc {
    # vrr=1 made DP-1's lying LCDTV16 panel negotiate VRR on the NVIDIA atomic
    # path -> first page-flip event never completed -> "Cannot commit when a
    # page-flip is awaiting" stall -> DP-1 black (2026-06-16, 8th attempt).
    # vrr=0 removes the stall and DP-1 builds a clean swapchain. (Trade-off:
    # eDP-1 loses VRR too; switch to vrr=2 for fullscreen-only once DP-1 lights.)
    vrr = 0

    animate_manual_resizes = false
    animate_mouse_windowdragging = false

    disable_hyprland_logo = true
    force_default_wallpaper = 0

    on_focus_under_fullscreen = 2
    allow_session_lock_restore = true
    middle_click_paste = false
    focus_on_activate = true
    session_lock_xray = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

	background_color = rgb($surfaceContainer)
}

debug {
    error_position = 1
    vfr = true
}
