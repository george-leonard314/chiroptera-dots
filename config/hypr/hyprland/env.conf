# ############# Themes #############
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, $cursorSize

# ######## Toolkit backends ########
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ####### XDG specifications #######
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# ############# Others #############
env = _JAVA_AWT_WM_NONREPARENTING, 1

# ############# GPU #############
# Hybrid AMD iGPU + NVIDIA dGPU. Render on the AMD iGPU; NVIDIA has poor
# Wayland compositing perf here. DP-1 is the ONLY output wired to NVIDIA.
# With AMD as primary renderer, DP-1's frames had to be blitted across GPUs and
# scanned out by NVIDIA as a SECONDARY device -> output stayed black (NVIDIA is
# unreliable when importing another GPU's buffers; intermittent "Cannot commit
# when a page-flip is awaiting" stalls). Fix (2026-06-16): make NVIDIA the
# PRIMARY renderer so DP-1 renders + scans out on the SAME GPU. eDP-1/HDMI-A-1
# then become AMD imports, which is the robust direction. Tradeoff: dGPU runs
# full-time -> higher power/heat on the laptop.
#
# AQ_DRM_DEVICES is a COLON-separated list and the FIRST entry is the primary
# renderer. Use card nodes (NO colons in the name) -- by-path names contain
# colons (pci-0000:06:00.0) and broke parsing before. NVIDIA must be first.
# NOTE: card numbering can swap across REBOOTS (not across logout/login). On
# 2026-06-16 card0=NVIDIA, card1=AMD. If DP-1 goes black again after a reboot,
# re-check the card->driver mapping and put the NVIDIA card node first:
#   for c in /sys/class/drm/card[0-9]; do echo $c $(basename $(readlink -f $c/device/driver)); done
# NVIDIA-primary (card0:card1) made ALL outputs black -> dead end.
# TRYING 2026-06-16: AMD primary, NVIDIA explicitly listed second, no modifiers.
# This is the reverse-PRIME path (NVIDIA scans out AMD-rendered DP-1 frames).
# card1=AMD card0=NVIDIA on THIS boot -- numbering can swap across reboots, so
# this is only valid until next reboot. If black: Ctrl+Alt+F3 to tty, revert.
# 2026-06-16 (3rd attempt): runtime log showed the REAL failure on DP-1:
#   EGL (verifyDestinationDMABUF): FAIL, format is external-only
#   EGL (blit): failed to blit: destination dmabuf unsupported
#   drm: Backend requires blit, but blit failed
# AMD renders the frame fine; aquamarine then forces a LINEAR explicit modifier
# on the cross-GPU destination buffer that NVIDIA scans out, and NVIDIA reports
# that format as external-only -> AMD EGL can't use it as a blit target ->
# nothing scanned out -> DP-1 black. Per Hyprland wiki, AQ_FORCE_LINEAR_BLIT=0
# "Disables forcing linear explicit modifiers on Multi-GPU buffers to
# potentially workaround Nvidia issues." Single-variable change from the prior
# failing config (still AMD primary + AQ_NO_MODIFIERS=1).
# 2026-06-16 (4th attempt): CLEAN NVIDIA-primary. AMD-primary is a confirmed
# dead end (3rd attempt above): it must blit AMD-rendered frames into an NVIDIA
# scanout buffer, and NVIDIA (610.43.02 open) reports that buffer as
# external-only -> AMD EGL can't use it as a blit target. AQ_FORCE_LINEAR_BLIT=0
# changed NOTHING (byte-identical failure). Attempt #2 (NVIDIA-primary) went
# all-black, BUT it bundled AQ_NO_MODIFIERS=1, which alone breaks AMD scanout --
# so NVIDIA-primary was never cleanly tested. Here NVIDIA is first => DP-1
# renders AND scans out on the SAME GPU (no blit), and eDP-1/HDMI-A-1 become AMD
# imports (the robust direction). NO other AQ_ flags, on purpose.
# 2026-06-16 (6th attempt, post fbdev/early-KMS reboot): numbering SWAPPED --
# card0 vanished; NOW card1=NVIDIA (pci 0000:01:00.0), card2=AMD (pci 0000:06:00.0).
# Stale card0:card1 excluded AMD entirely -> ALL outputs black. Corrected to
# card1(NVIDIA):card2(AMD). RE-VERIFY mapping every boot before trusting:
#   for c in /sys/class/drm/card[0-9]; do echo $c $(basename $(readlink -f $c/device/driver)); done
# If black: Ctrl+Alt+F2 -> tty -> ~/revert-gpu.sh.
# 2026-06-16 (9th attempt, post closed-580-driver reboot): numbering SWAPPED
# AGAIN -- now card0=NVIDIA (pci 0000:01:00.0), card1=AMD (pci 0000:06:00.0),
# and there is NO card2. The stale card1:card2 listed AMD first + a nonexistent
# card2 -> NVIDIA was EXCLUDED entirely -> aquamarine opened only AMD -> DP-1
# (NVIDIA-only output) never initialized -> black. This means the closed 580
# driver was NEVER actually tested on the NVIDIA-primary path. Corrected to
# card0(NVIDIA):card1(AMD). RE-VERIFY mapping every boot before trusting:
#   for c in /sys/class/drm/card*; test -e $c/device/driver; and echo $c (basename (readlink -f $c/device/driver)); end
# env = AQ_DRM_DEVICES, /dev/dri/card0:/dev/dri/card1
# 2026-06-16 (5th attempt): #4 (clean NVIDIA-primary) RESULT: eDP-1 + HDMI-A-1
# work (AMD imports; EGL_BAD_MATCH createImageFromDmaBufs is non-fatal -> blit
# falls back to an intermediate buffer and presents). DP-1 modesets natively on
# NVIDIA but the first atomic page-flip never completes:
#   drm: Modesetting DP-1 with 1360x768@60.37Hz
#   drm: Cannot commit when a page-flip is awaiting   (x8, 0 successful flips)
# -> DP-1 stays black and flaps connect/disconnect. This is the NVIDIA atomic
# page-flip-event stall, NOT the #3 blit-destination wall. Two restart-only
# levers (both vars verified present in libaquamarine.so.11):
#   AQ_NO_ATOMIC=1      -> legacy pageflip, bypasses broken atomic flip events
#   AQ_MGPU_NO_EXPLICIT=1 -> disable explicit sync (log: "Explicit sync supported")
# If black: Ctrl+Alt+F2 -> tty -> ~/revert-gpu.sh (now also strips these two).
# 2026-06-16 (7th attempt): fbdev/early-KMS is NOW live (modprobe.d
# nvidia_drm fbdev=1 modeset=1 + nvidia in mkinitcpio MODULES + in initramfs;
# /proc/fb shows "1 nvidia-drmdrmfb" -> nvidia_drm fbdev active). The #4 atomic
# stall ("Cannot commit when a page-flip is awaiting") is the classic
# missing-fbdev symptom. AQ_NO_ATOMIC (5th attempt) was only a workaround for
# that stall and introduced the legacy-modeset-but-black path. So re-test CLEAN
# atomic NVIDIA-primary with fbdev now on: both vars below DISABLED.
# If DP-1 still black: Ctrl+Alt+F2 -> tty -> ~/revert-gpu.sh.
# env = AQ_NO_ATOMIC, 1
# env = AQ_MGPU_NO_EXPLICIT, 1
