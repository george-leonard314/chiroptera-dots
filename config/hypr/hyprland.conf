$hypr = ~/.config/hypr
$hl = $hypr/hyprland
$cConf = ~/.config/chiroptera

# Variables (colours + other vars)
exec = cp -L --no-preserve=mode --update=none $hypr/scheme/default.conf $hypr/scheme/current.conf
source = $hypr/scheme/current.conf
source = $hypr/variables.conf

# Configs
source = $hl/env.conf
source = $hl/general.conf
source = $hl/input.conf
source = $hl/misc.conf
source = $hl/animations.conf
source = $hl/decoration.conf
source = $hl/group.conf
source = $hl/execs.conf
source = $hl/rules.conf
source = $hl/gestures.conf
source = $hl/keybinds.conf
source = $hypr/monitors.conf

# Window and group border colours from the shell's Hyprland theme template, re-rendered
# on every palette change. Sourced before user.conf so personal overrides still win.
source = $hypr/chiroptera.conf

# Chiroptera binds and rules, then user overrides, sourced last so they win.
source = $hl/chiroptera.conf
source = $hl/user.conf

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = nm-applet --indicator
