# Chiroptera Shell user config (declarative base; Settings GUI overrides live in
# ~/.local/state/chiroptera/settings.toml). Captured into chiroptera-dots in step 2.

[theme.templates]
enable_builtin_templates   = true
builtin_ids                = ["foot", "btop", "gtk3", "gtk4", "qt"]
# Community templates are read only from ~/.local/state/chiroptera/community-templates,
# which nothing here fills; every template this config enables ships with it.
enable_community_templates = false
community_ids              = []

# Zen Browser follows the wallpaper palette through userChrome.css and userContent.css
# in every Zen profile (apply.sh @imports the rendered files); the Zen autoconfig in
# chiroptera-meta recolors open windows live. A no-op when Zen is not installed. Both
# entries run the same apply.sh, so neither runs it in the background.
[theme.templates.user.zen-browser-chrome]
input_path  = "~/.config/chiroptera/templates/zen-browser/zen-userChrome.css"
output_path = "~/.cache/chiroptera/zen-browser/zen-userChrome.css"
post_hook   = "bash ~/.config/chiroptera/templates/zen-browser/apply.sh"
hook_async  = false

[theme.templates.user.zen-browser-content]
input_path  = "~/.config/chiroptera/templates/zen-browser/zen-userContent.css"
output_path = "~/.cache/chiroptera/zen-browser/zen-userContent.css"
post_hook   = "bash ~/.config/chiroptera/templates/zen-browser/apply.sh"
hook_async  = false

# Live-recolor every open terminal when the palette changes (foot cannot reload
# its config, so OSC sequences are pushed to each pty).
[theme.templates.user.terminal-sequences]
input_path  = "~/.config/chiroptera/templates/terminal-sequences"
output_path = "~/.cache/terminal-sequences"
post_hook   = "tee /dev/pts/[0-9]* < ~/.cache/terminal-sequences"

# Control-center button shows the Chiroptera bat, tinted with the widget colour so it
# follows the palette. The launcher keeps its default glyph.
[widget.control-center]
custom_image          = "~/.local/share/chiroptera/branding/chiroptera-bat-icon.svg"
custom_image_colorize = true

# fastfetch logo: the dragon as an SVG whose gradient follows the palette; the hook
# renders the PNG that fastfetch prints via Sixel, so every new fastfetch matches the wallpaper.
[theme.templates.user.fastfetch-logo]
input_path  = "~/.config/chiroptera/templates/fastfetch-logo.svg"
output_path = "~/.local/share/chiroptera/branding/fastfetch-logo.svg"
post_hook   = "rsvg-convert -w 480 ~/.local/share/chiroptera/branding/fastfetch-logo.svg -o ~/.local/share/chiroptera/branding/fastfetch-logo.png.tmp && mv -f ~/.local/share/chiroptera/branding/fastfetch-logo.png.tmp ~/.local/share/chiroptera/branding/fastfetch-logo.png && rm -rf ~/.cache/fastfetch/images"
# Run inline so the PNG is never half-written or stale when a terminal starts.
hook_async  = false

# The picker opens the folder install.sh fills, not all of ~/Pictures.
[wallpaper]
directory = "~/Pictures/Wallpapers"

# Wallpaper every new account starts with; the picker's choice then overrides it.
[wallpaper.default]
path = "/usr/share/backgrounds/chiroptera/chiroptera-default.png"

# VSCodium follows the wallpaper palette live: the template renders the palette JSON and the
# hook merges it into settings.json (colorCustomizations apply on save, no reload needed).
[theme.templates.user.vscodium]
input_path  = "~/.config/chiroptera/templates/vscodium-colors.json"
output_path = "~/.cache/chiroptera/vscodium/colors.json"
post_hook   = "python3 ~/.config/chiroptera/templates/vscodium-apply.py"
hook_async  = false

# Equicord follows the wallpaper palette; surfaces are 80% opaque (edit the % in the template).
[theme.templates.user.equicord]
input_path  = "~/.config/chiroptera/templates/equicord.theme.css"
output_path = "~/.config/Equicord/themes/chiroptera.theme.css"

# Elecwhat (WhatsApp Web): the palette is injected as custom CSS on page load (no live reload).
[theme.templates.user.elecwhat]
input_path  = "~/.config/chiroptera/templates/elecwhat.css"
output_path = "~/.config/elecwhat/chiroptera.css"

# The bar: transparent, with the widgets gathered into capsules. After the launcher sit the
# OBS button (ayagmar/obs-control: record, replay buffer, stream; it needs obs-studio and
# python-websocket-client) and the update counter (yuuto/arch-updater; it needs checkupdates
# from pacman-contrib). chiroptera-meta pulls in all three. Both plugins ship with
# chiroptera-dots (share/chiroptera/plugins) and are installed into
# ~/.local/share/chiroptera/plugins, the shell's local plugin source; nothing is fetched.
# In OBS, Tools - WebSocket Server Settings - Enable WebSocket server once, so the button
# can reach it.
[bar.default]
background_opacity = 0.0
margin_ends = 9
start  = ["launcher", "group:g2", "group:g3", "obs", "updates"]
center = ["group:g1"]
end    = ["group:g4", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session"]

[[bar.default.capsule_group]]
id      = "g1"
members = ["control-center", "workspaces"]
fill    = "surface_variant"
padding = 6.0

[[bar.default.capsule_group]]
id      = "g2"
members = ["media", "audio_visualizer"]
fill    = "surface_variant"
padding = 6.0

[[bar.default.capsule_group]]
id      = "g3"
members = ["wallpaper", "w-engine"]
fill    = "surface_variant"
padding = 6.0

[[bar.default.capsule_group]]
id      = "g4"
members = ["clock", "date"]
fill    = "surface_variant"
padding = 6.0

[widget.audio_visualizer]
width = 89

[widget.network]
show_label     = false
show_vpn_label = true

[widget.obs]
type = "ayagmar/obs-control:status"

[widget.updates]
type = "yuuto/arch-updater:widget"

# Wallpaper Engine wallpapers (live scenes and videos from the Steam Workshop),
# next to the wallpaper picker; needs Wallpaper Engine owned and installed in Steam.
[widget.w-engine]
type = "tadomika_ari/w-engine:w-engine-widget"

[plugins]
enabled = ["yuuto/arch-updater", "ayagmar/obs-control", "tadomika_ari/w-engine"]
